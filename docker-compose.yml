services:
  cassandra:
    image: cassandra:4.1
    container_name: todolist_cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=TodoListCluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  cassandra-init:
    build:
      context: .
      dockerfile: deploy/cassandra-init.Dockerfile
    container_name: todolist_cassandra_init
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: todolist_app
    ports:
      - "${SERVER_PORT:-7071}:7071"
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    environment:
      CASSANDRA_HOSTS: "cassandra:9042"
      CASSANDRA_KEYSPACE: "todolist"
      SERVER_PORT: "7071"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7071/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    container_name: todolist_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  cassandra_data:
    driver: local
